# Compila la web y la publica en GitHub Pages cada vez que se sube un commit a main.
name: Publicar en GitHub Pages

# De momento solo se lanza a mano (pestaña Actions → «Run workflow»).
# Cuando quieras que se publique con cada `git push`, borra los # de las dos líneas de push.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # GitHub Pages no sabe que /personajes es una página de React: al recargarla
      # sirve 404.html, así que ese archivo tiene que ser una copia de index.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
